<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบลงทะเบียนนักศึกษา</title>
  <style>
    body { font-family: Tahoma, sans-serif; max-width: 760px; margin: 30px auto; padding: 0 16px; }
    input, button { padding: 9px; margin: 4px 0; width: 100%; box-sizing: border-box; }
    button { background: #1f883d; color: #fff; border: 0; cursor: pointer; font-size: 16px; border-radius: 4px; }
    button:hover { background: #1a7333; }
    table { width: 100%; border-collapse: collapse; margin-top: 18px; }
    th, td { border: 1px solid #ccc; padding: 7px; text-align: left; }
    th { background: #eef5f1; }
    #msg { font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>ระบบลงทะเบียนนักศึกษา</h1>
  <input id="first_name" placeholder="ชื่อ *">
  <input id="last_name" placeholder="นามสกุล *">
  <input id="nickname" placeholder="ชื่อเล่น">
  <input id="student_id" placeholder="เลขนักศึกษา *">
  <input id="major" placeholder="สาขาวิชา *">
  <button id="btn-submit" onclick="register()">ลงทะเบียน</button>
  <p id="msg"></p>

  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>ชื่อ-นามสกุล</th>
        <th>ชื่อเล่น</th>
        <th>เลขนักศึกษา</th>
        <th>สาขาวิชา</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // 1) เชื่อมต่อ Supabase (นำค่าจาก Project Settings > API มาใส่แทนที่ข้อความด้านล่าง)
    const SUPABASE_URL = 'https://xztmtajioewihketbckc.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_ocrpiXCXulVqDkfNr9FNyg__4NBCNy5';

    const msg = document.getElementById('msg');
    let db = null;

    // ตรวจสอบว่าใส่ URL และ Key หรือยัง เพื่อป้องกัน Error หน้าเว็บพัง
    if (SUPABASE_URL.startsWith('http')) {
      db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    } else {
      msg.style.color = 'red';
      msg.textContent = '⚠️ กรุณาใส่ SUPABASE_URL และ SUPABASE_KEY ในโค้ดก่อนใช้งาน';
    }

    const fields = ['first_name', 'last_name', 'nickname', 'student_id', 'major'];
    const val = (id) => document.getElementById(id).value.trim();

    // 2) เพิ่มข้อมูลลงทะเบียน
    async function register() {
      if (!db) return;
      msg.style.color = 'black';

      const row = {
        first_name: val('first_name'),
        last_name: val('last_name'),
        nickname: val('nickname'),
        student_id: val('student_id'),
        major: val('major')
      };

      if (!row.first_name || !row.last_name || !row.student_id || !row.major) {
        msg.style.color = 'red';
        msg.textContent = 'กรุณากรอกข้อมูลที่มีเครื่องหมาย * ให้ครบ';
        return;
      }

      const btn = document.getElementById('btn-submit');
      btn.disabled = true;
      btn.textContent = 'กำลังบันทึก...';

      const { error } = await db.from('registrations').insert(row);

      btn.disabled = false;
      btn.textContent = 'ลงทะเบียน';

      if (error) {
        msg.style.color = 'red';
        msg.textContent = (error.code === '23505') 
          ? 'เลขนักศึกษานี้ลงทะเบียนแล้ว' 
          : 'เกิดข้อผิดพลาด: ' + error.message;
        return;
      }

      msg.style.color = 'green';
      msg.textContent = 'ลงทะเบียนสำเร็จ';
      fields.forEach((id) => document.getElementById(id).value = '');
      loadRows();
    }

    // 3) ดึงข้อมูลมาแสดงเป็นตาราง
    async function loadRows() {
      if (!db) return;

      const { data, error } = await db
        .from('registrations')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        msg.style.color = 'red';
        msg.textContent = 'อ่านข้อมูลไม่ได้: ' + error.message;
        return;
      }

      const tb = document.getElementById('rows');
      tb.innerHTML = '';
      data.forEach((r) => {
        const tr = document.createElement('tr');
        [r.id, `${r.first_name} ${r.last_name}`, r.nickname || '-', r.student_id, r.major].forEach((v) => {
          const td = document.createElement('td');
          td.textContent = v;
          tr.appendChild(td);
        });
        tb.appendChild(tr);
      });
    }

    // โหลดข้อมูลครั้งแรกเมื่อเปิดหน้าเว็บ
    if (db) loadRows();
  </script>
</body>
</html>
